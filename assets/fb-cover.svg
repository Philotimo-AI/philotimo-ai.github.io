  <path d="M1432 170 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5 z" fill="#ffb37a" opacity="0.75"/>
  <path d="M236 118 l6 15 15 6 -15 6 -6 15 -6 -15 -15 -6 15 -6 z" fill="#ffb37a" opacity="0.7"/>

