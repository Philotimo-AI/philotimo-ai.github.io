    <text x="820" y="262" font-size="80" font-weight="bold" fill="#f9f1e0">sterilisation in South Africa</text>
    <text x="820" y="340" font-size="40" fill="#d9efe9">Prices, clinic days and contacts where they are published &#8212;</text>
    <text x="820" y="392" font-size="40" fill="#d9efe9">and plainly said where they are not. Every fact dated.</text>
